<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>অ্যাডমিন ড্যাশবোর্ড — বাড়ি ভাড়া ম্যানেজার</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#262016; --ink-soft:#6b5f4d;
    --paper:#EFE7D5; --paper-deep:#E4D9C1; --card:#FFFCF6; --rule:#D9CBA8;
    --brass:#96652B; --brass-dark:#6E4A1E; --brass-soft:#F0E2C4;
    --stamp-red:#9A3A2D; --stamp-red-soft:#F5E1DC;
    --stamp-green:#3E6B49; --stamp-green-soft:#E2ECDF;
    --stamp-amber:#A6721E; --stamp-amber-soft:#F3E6C8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
  h1,h2{font-family:'Tiro Bangla',Georgia,serif;font-weight:700;}
  header{background:linear-gradient(160deg,#2A2015,#4A331B,#6E4A22);color:#F0E2C4;padding:20px;text-align:center;}
  header h1{font-size:1.3rem;margin:0;}
  .wrap{max-width:960px;margin:0 auto;padding:22px 16px 60px;}

  /* লগইন গেট */
  #gate{max-width:360px;margin:70px auto;text-align:center;}
  #gate input{width:100%;padding:13px;border-radius:10px;border:1.5px solid var(--rule);margin-bottom:12px;font-size:1rem;text-align:center;background:var(--card);color:var(--ink);}
  #gate button{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--brass-dark),var(--brass));color:#FBF3DE;font-weight:700;font-size:0.95rem;cursor:pointer;}
  #gate p{font-size:0.85rem;color:var(--ink-soft);margin-top:10px;}

  .summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
  .summary-card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;text-align:center;}
  .summary-card .num{font-family:'Tiro Bangla',serif;font-size:1.4rem;font-weight:700;color:var(--brass-dark);}
  .summary-card .lbl{font-size:0.72rem;color:var(--ink-soft);margin-top:2px;}

  .cust-card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
  .cust-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .cust-name{font-family:'Tiro Bangla',serif;font-size:1.05rem;font-weight:700;}
  .cust-key{font-size:0.78rem;color:var(--ink-soft);}
  .badge{font-size:0.72rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px dashed;}
  .badge.active{background:var(--stamp-green-soft);color:var(--stamp-green);border-color:var(--stamp-green);}
  .badge.expired{background:var(--stamp-red-soft);color:var(--stamp-red);border-color:var(--stamp-red);}
  .cust-meta{margin-top:10px;font-size:0.86rem;color:var(--ink-soft);display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .cust-meta b{color:var(--ink);}
  .toggle-btn{margin-top:10px;font-size:0.8rem;color:var(--brass-dark);font-weight:700;cursor:pointer;background:none;border:none;padding:0;}
  .edit-link{background:none;border:none;cursor:pointer;font-size:0.8rem;padding:0 2px;opacity:0.7;}
  .edit-link:hover{opacity:1;}
  .detail{margin-top:12px;border-top:1px dashed var(--rule);padding-top:10px;display:none;}
  .detail.show{display:block;}
  .tenant-line{display:flex;justify-content:space-between;font-size:0.85rem;padding:5px 0;border-bottom:1px solid var(--paper-deep);}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .refresh-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .refresh-bar button{background:var(--card);border:1.5px solid var(--rule);border-radius:9px;padding:9px 16px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-size:0.85rem;}
</style>
</head>
<body>
  <header><h1>📊 অ্যাডমিন ড্যাশবোর্ড</h1></header>
  <div class="wrap">
    <div id="gate">
      <h2 style="margin-bottom:14px">লগইন করুন</h2>
      <input id="token-input" type="password" placeholder="আপনার সিক্রেট টোকেন" />
      <button onclick="loadDashboard()">দেখুন</button>
      <p>এই টোকেনটা আপনার Apps Script কোডে যা বসিয়েছেন সেটাই।</p>
    </div>
    <div id="dashboard" style="display:none"></div>
  </div>

  <script>
    // ⚠️ এখানে আপনার Apps Script Web App-এর লিংক বসান (index.html-এ যেটা LICENSE_BIND_SCRIPT_URL এ বসিয়েছেন, একই লিংক)
    var ADMIN_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyYjBGuXPV68xbqVCkR7fuXlAqELzxk2m-utONwx77iHU2defii34EgOHs7kFvMFdAE/exec';

    function loadDashboard() {
      var token = document.getElementById('token-input').value.trim();
      if (!token) return;
      localStorage.setItem('adminToken', token);
      var url = ADMIN_SCRIPT_URL + (ADMIN_SCRIPT_URL.indexOf('?') > -1 ? '&' : '?') + 'token=' + encodeURIComponent(token);
      document.getElementById('gate').innerHTML = '<p>লোড হচ্ছে...</p>';
      fetch(url).then(function(r) { return r.json(); }).then(function(rows) {
        if (rows && rows.error) {
          document.getElementById('gate').innerHTML = '<h2>❌ ভুল টোকেন</h2><button onclick="location.reload()" style="margin-top:10px">আবার চেষ্টা করুন</button>';
          return;
        }
        renderDashboard(rows || []);
      }).catch(function() {
        document.getElementById('gate').innerHTML = '<h2>লোড ব্যর্থ</h2><p>ইন্টারনেট চেক করুন অথবা ADMIN_SCRIPT_URL ঠিক আছে কিনা দেখুন।</p><button onclick="location.reload()" style="margin-top:10px">আবার চেষ্টা করুন</button>';
      });
    }

    function fmtDate(val) {
      if (!val) return '-';
      var s = String(val);
      var m = s.match(/^(\d{4}-\d{2}-\d{2})/);
      return m ? m[1] : s;
    }
    function todayISO() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function renderDashboard(rows) {
      document.getElementById('gate').style.display = 'none';
      var dash = document.getElementById('dashboard');
      dash.style.display = 'block';

      var today = todayISO();
      var activeCount = rows.filter(function(r) { return r.expiry && r.expiry >= today; }).length;
      var expiredCount = rows.length - activeCount;
      var totalTenants = 0;
      rows.forEach(function(r) {
        var parsed = safeParse(r.data);
        if (parsed && parsed.tenants) totalTenants += parsed.tenants.filter(function(t){return !t.left;}).length;
      });

      var html = '<div class="refresh-bar"><span style="font-size:0.85rem;color:var(--ink-soft)">মোট ' + rows.length + ' জন কাস্টমার</span><button onclick="location.reload()">🔄 রিফ্রেশ</button></div>';
      html += '<div class="summary-row">';
      html += '<div class="summary-card"><div class="num">' + rows.length + '</div><div class="lbl">মোট কাস্টমার</div></div>';
      html += '<div class="summary-card"><div class="num" style="color:var(--stamp-green)">' + activeCount + '</div><div class="lbl">সক্রিয়</div></div>';
      html += '<div class="summary-card"><div class="num" style="color:var(--stamp-red)">' + expiredCount + '</div><div class="lbl">মেয়াদ শেষ</div></div>';
      html += '<div class="summary-card"><div class="num">' + totalTenants + '</div><div class="lbl">সর্বমোট ভাড়াটিয়া</div></div>';
      html += '</div>';

      if (!rows.length) {
        html += '<div class="empty">এখনো কোনো কাস্টমারের ডাটা আসেনি।</div>';
      }

      rows.sort(function(a,b){ return (b.lastUpdated||'').localeCompare(a.lastUpdated||''); });

      rows.forEach(function(r, idx) {
        var isActive = r.expiry && r.expiry >= today;
        var parsed = safeParse(r.data);
        var tenants = (parsed && parsed.tenants) ? parsed.tenants.filter(function(t){return !t.left;}) : [];
        var totalRent = tenants.reduce(function(s,t){ return s + (parseInt(t.rent)||0); }, 0);

        html += '<div class="cust-card">';
        html += '<div class="cust-top"><div><div class="cust-name">' + esc(r.customerName || 'নাম নেই') + '</div><div class="cust-key">কোড: ' + esc(r.key) + '</div></div>';
        html += '<span class="badge ' + (isActive?'active':'expired') + '">' + (isActive ? '✓ সক্রিয়' : '✕ মেয়াদ শেষ') + '</span></div>';
        html += '<div class="cust-meta">';
        html += '<div>মেয়াদ: <b id="expiry-' + idx + '">' + esc(fmtDate(r.expiry)) + '</b> <button class="edit-link" onclick="editField(' + idx + ',\'expiry\',\'' + esc(r.key) + '\')">✏️</button></div>';
        html += '<div>Gmail: <b id="email-' + idx + '">' + esc(r.boundEmail || 'এখনো বাঁধা হয়নি') + '</b> <button class="edit-link" onclick="editField(' + idx + ',\'boundEmail\',\'' + esc(r.key) + '\')">✏️</button></div>';
        html += '<div>ভাড়াটিয়া: <b>' + tenants.length + ' জন</b></div>';
        html += '<div>মোট মাসিক ভাড়া: <b>৳' + totalRent.toLocaleString() + '</b></div>';
        html += '</div>';
        html += '<div style="font-size:0.75rem;color:var(--ink-soft);margin-top:6px">শেষ ডাটা আপডেট: ' + (r.lastUpdated ? new Date(r.lastUpdated).toLocaleString() : 'এখনো হয়নি') + '</div>';

        if (tenants.length) {
          html += '<button class="toggle-btn" onclick="toggleDetail(' + idx + ')">বিস্তারিত দেখুন ▾</button>';
          html += '<div class="detail" id="detail-' + idx + '">';
          tenants.forEach(function(t) {
            html += '<div class="tenant-line"><span>' + esc(t.name || '-') + '</span><span>৳' + (parseInt(t.rent)||0).toLocaleString() + '/মাস</span></div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });

      dash.innerHTML = html;
    }

    function editField(idx, field, key) {
      var el = document.getElementById((field === 'expiry' ? 'expiry-' : 'email-') + idx);
      var current = el.textContent === 'এখনো বাঁধা হয়নি' ? '' : el.textContent;
      var placeholder = field === 'expiry' ? 'YYYY-MM-DD' : 'email@gmail.com';
      el.outerHTML = '<span id="' + (field==='expiry'?'expiry-':'email-') + idx + '">' +
        '<input id="inp-' + idx + '-' + field + '" value="' + esc(current) + '" placeholder="' + placeholder + '" style="padding:5px 8px;border-radius:6px;border:1.5px solid var(--rule);font-size:0.85rem;width:150px" />' +
        ' <button onclick="saveField(' + idx + ',\'' + field + '\',\'' + esc(key) + '\')" style="padding:5px 10px;border-radius:6px;border:none;background:var(--brass);color:#FBF3DE;font-weight:700;font-size:0.8rem;cursor:pointer">সেভ</button></span>';
    }
    function saveField(idx, field, key) {
      var val = document.getElementById('inp-' + idx + '-' + field).value.trim();
      var token = localStorage.getItem('adminToken');
      fetch(ADMIN_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ type: 'admin_update', token: token, key: key, field: field, value: val })
      }).finally(function() { location.reload(); });
    }
    function toggleDetail(idx) {
      document.getElementById('detail-' + idx).classList.toggle('show');
    }
    function safeParse(j) {
      if (!j) return null;
      try { return JSON.parse(j); } catch(e) { return null; }
    }
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }

    // আগে টোকেন সেভ করা থাকলে সেটা দিয়ে বসিয়ে দাও (আবার টাইপ করা লাগবে না)
    var savedToken = localStorage.getItem('adminToken');
    if (savedToken) document.getElementById('token-input').value = savedToken;
  </script>
</body>
</html>
