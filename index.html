<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4A331B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>বাড়ি ভাড়া ম্যানেজার</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #262016;
      --ink-soft: #6b5f4d;
      --paper: #EFE7D5;
      --paper-deep: #E4D9C1;
      --card: #FFFCF6;
      --rule: #D9CBA8;
      --brass: #96652B;
      --brass-dark: #6E4A1E;
      --brass-soft: #F0E2C4;
      --brass-rgb: 150,101,43;
      --header-c1: #2A2015;
      --header-c2: #4A331B;
      --header-c3: #6E4A22;
      --stamp-red: #9A3A2D;
      --stamp-red-soft: #F5E1DC;
      --stamp-green: #3E6B49;
      --stamp-green-soft: #E2ECDF;
      --stamp-amber: #A6721E;
      --stamp-amber-soft: #F3E6C8;
      /* --- legacy variable names kept for JS-generated inline styles --- */
      --primary: var(--brass);
      --primary-dark: var(--brass-dark);
      --primary-soft: var(--brass-soft);
      --accent: var(--stamp-amber);
      --bg: var(--paper);
      --text: var(--ink);
      --muted: var(--ink-soft);
      --danger: var(--stamp-red);
      --success: var(--stamp-green);
      --warning: var(--stamp-amber);
      --border: var(--rule);
      --shadow: 0 1px 2px rgba(58,42,15,0.07), 0 10px 22px -6px rgba(58,42,15,0.16);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Hind Siliguri', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--paper);
      background-image:
        linear-gradient(var(--paper) 0%, var(--paper) 100%),
        repeating-linear-gradient(180deg, rgba(var(--brass-rgb),0.05) 0px, rgba(var(--brass-rgb),0.05) 1px, transparent 1px, transparent 34px);
      color: var(--ink); min-height: 100vh;
      padding-bottom: 92px; line-height: 1.5;
    }
    header {
      background: linear-gradient(160deg, var(--header-c1) 0%, var(--header-c2) 55%, var(--header-c3) 100%);
      color: var(--brass-soft); padding: 22px 20px 26px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 10px 26px rgba(30,20,8,0.28);
      border-bottom: 3px solid var(--brass);
    }
    header h1 {
      font-family: 'Tiro Bangla', Georgia, serif; font-size: 1.32rem; font-weight: 700;
      letter-spacing: 0.2px; color: #FBF3DE;
    }
    header p { font-size: 0.78rem; opacity: 0.75; margin-top: 5px; font-weight: 500; letter-spacing: 0.3px; }
    .container { padding: 16px; max-width: 540px; margin: 0 auto; }
    .card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 16px; margin-bottom: 12px; border: 1px solid var(--rule);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .tenant-card { cursor: pointer; position: relative; border-left: 3px solid var(--brass); padding-left: 14px; }
    .tenant-card:active { transform: scale(0.985); }
    .tenant-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .tenant-name {
      font-family: 'Tiro Bangla', Georgia, serif; font-size: 1.08rem; font-weight: 700;
      color: var(--ink); letter-spacing: 0.1px;
    }
    .floor-badge {
      background: var(--card); color: var(--brass-dark); font-size: 0.68rem; padding: 5px 11px;
      border-radius: 999px; white-space: nowrap; font-weight: 700;
      border: 1.5px dashed var(--brass); letter-spacing: 0.2px;
    }
    .floor-badge.due { background: var(--stamp-red-soft); color: var(--stamp-red); border-color: var(--stamp-red); }
    .floor-badge.paid { background: var(--stamp-green-soft); color: var(--stamp-green); border-color: var(--stamp-green); }
    .floor-badge.partial { background: var(--stamp-amber-soft); color: var(--stamp-amber); border-color: var(--stamp-amber); }
    .amount-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip {
      background: var(--brass-soft); color: var(--brass-dark); padding: 4px 10px;
      border-radius: 8px; font-size: 0.75rem; font-weight: 700;
    }
    .chip.sub { background: var(--stamp-amber-soft); color: var(--stamp-amber); }
    .chip.gas { background: #F1E3E9; color: #8A3A54; }
    .chip.due { background: var(--stamp-red-soft); color: var(--stamp-red); }
    .chip.paid { background: var(--stamp-green-soft); color: var(--stamp-green); }
    nav.bottom {
      position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,252,246,0.96);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: flex; justify-content: space-around;
      padding: 8px 0 calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -6px 22px rgba(58,42,15,0.10); z-index: 100;
      border-top: 1px solid var(--rule);
    }
    nav.bottom button {
      background: none; border: none; display: flex; flex-direction: column;
      align-items: center; gap: 3px; font-size: 0.68rem; color: #A8987A;
      padding: 6px 12px; cursor: pointer; min-width: 58px; border-radius: 10px;
      font-weight: 600; transition: color 0.15s, background 0.15s;
    }
    nav.bottom button.active { color: var(--brass-dark); background: var(--brass-soft); }
    nav.bottom button span.icon { font-size: 1.28rem; }
    label { display: block; font-size: 0.78rem; font-weight: 700; margin-bottom: 5px; color: var(--ink-soft); }
    input, select, textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--rule);
      border-radius: 10px; font-size: 0.95rem; margin-bottom: 12px; background: var(--card);
      color: var(--ink); font-family: inherit;
      transition: border 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--brass);
      box-shadow: 0 0 0 4px rgba(150,101,43,0.14);
    }
    input[readonly] { background: var(--paper-deep); color: var(--ink-soft); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px 16px; border: none; border-radius: 10px;
      font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--brass-dark), var(--brass));
      color: #FBF3DE; width: 100%; box-shadow: 0 4px 14px rgba(110,74,30,0.32);
    }
    .btn-secondary { background: #E4E9EC; color: #395064; }
    .btn-danger { background: var(--stamp-red-soft); color: var(--stamp-red); }
    .btn-accent { background: var(--stamp-amber-soft); color: var(--stamp-amber); }
    .btn-success { background: var(--stamp-green-soft); color: var(--stamp-green); }
    .btn-sm { padding: 8px 12px; font-size: 0.8rem; width: auto; border-radius: 8px; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(38,32,22,0.5);
      z-index: 200; display: none; align-items: flex-end; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--paper); width: 100%; max-width: 540px; max-height: 92vh;
      border-radius: 20px 20px 0 0; padding: 20px 18px 32px; border-top: 3px solid var(--brass);
      overflow-y: auto; animation: slideUp 0.25s cubic-bezier(0.32,0.72,0,1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h2 { font-family: 'Tiro Bangla', Georgia, serif; font-size: 1.15rem; font-weight: 700; color: var(--ink); }
    .close-btn {
      background: var(--card); border: 1px solid var(--rule); width: 36px; height: 36px;
      border-radius: 50%; font-size: 1.1rem; cursor: pointer; color: var(--ink-soft);
    }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .summary-card {
      background: var(--card); border-radius: 12px; padding: 14px;
      box-shadow: var(--shadow); text-align: center; border: 1px solid var(--rule);
    }
    .summary-card .label { font-size: 0.72rem; color: var(--ink-soft); font-weight: 600; }
    .summary-card .value { font-family: 'Tiro Bangla', Georgia, serif; font-size: 1.24rem; font-weight: 700; margin-top: 4px; }
    .summary-card.total .value { color: var(--brass-dark); }
    .summary-card.due .value { color: var(--stamp-red); }
    .summary-card.paid .value { color: var(--stamp-green); }
    .month-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card); padding: 10px 14px; border-radius: 12px;
      margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--rule);
    }
    .month-bar button {
      background: linear-gradient(135deg, var(--brass-dark), var(--brass));
      color: #FBF3DE; border: none; width: 36px; height: 36px; border-radius: 9px;
      font-size: 1.1rem; cursor: pointer; box-shadow: 0 2px 8px rgba(110,74,30,0.3);
    }
    .month-bar span { font-family: 'Tiro Bangla', Georgia, serif; font-weight: 700; font-size: 0.95rem; }
    .receipt {
      background: repeating-linear-gradient(180deg, #FFFCF6 0px, #FFFCF6 27px, #F2E7CC 28px);
      border: 2px dashed var(--brass); border-radius: 10px; padding: 16px;
      font-family: 'Courier New', monospace; font-size: 0.85rem;
    }
    .receipt h3 { font-family: 'Tiro Bangla', Georgia, serif; text-align: center; margin-bottom: 10px; color: var(--brass-dark); font-size: 1rem; }
    .receipt .line { display: flex; justify-content: space-between; margin: 4px 0; }
    .receipt .total-line { border-top: 1.5px solid var(--brass); margin-top: 8px; padding-top: 8px; font-weight: 700; }
    .receipt .due-line { color: var(--stamp-red); font-weight: 700; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
    .tab {
      padding: 8px 14px; border-radius: 999px; background: var(--card);
      border: 1px solid var(--rule); font-size: 0.8rem; white-space: nowrap; cursor: pointer; font-weight: 600; color: var(--ink-soft);
    }
    .tab.active { background: var(--brass); border-color: var(--brass); color: #FBF3DE; box-shadow: 0 2px 8px rgba(150,101,43,0.3); }
    .hidden { display: none !important; }
    .section-title {
      font-family: 'Tiro Bangla', Georgia, serif; font-size: 0.92rem; font-weight: 700; color: var(--brass-dark);
      margin: 16px 0 10px; display: flex; align-items: center; gap: 6px;
    }
    .empty-state { text-align: center; padding: 40px 18px; color: var(--ink-soft); font-size: 0.9rem; }
    .file-preview { max-width: 100%; max-height: 110px; border-radius: 10px; margin-top: 6px; }
    .history-item {
      background: var(--card); border-radius: 10px; padding: 10px 12px;
      margin-bottom: 8px; font-size: 0.82rem; border: 1px solid var(--rule);
      display: flex; justify-content: space-between; align-items: center;
    }
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--paper); padding: 12px 22px;
      border-radius: 999px; font-size: 0.88rem; z-index: 300;
      opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
      box-shadow: 0 8px 24px rgba(38,32,22,0.3);
    }
    .toast.show { opacity: 1; }
    .search-box {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1.5px solid var(--rule); margin-bottom: 12px; font-size: 0.95rem;
      background: var(--card); box-shadow: var(--shadow); font-family: inherit; color: var(--ink);
    }
    .info-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.88rem; border-bottom: 1px solid var(--paper-deep); }
    .info-row:last-child { border-bottom: none; }
    .left-badge {
      display: inline-block; background: var(--stamp-red-soft); color: var(--stamp-red);
      font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; margin-left: 6px; font-weight: 700;
    }
    .reading-box {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      background: var(--stamp-amber-soft); padding: 12px; border-radius: 10px; margin: 10px 0;
      border: 1px solid var(--stamp-amber);
    }
    .reading-box label { font-size: 0.68rem; margin-bottom: 3px; }
    .reading-box input { margin-bottom: 0; padding: 8px; font-size: 0.9rem; }
    .bulk-actions { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .sms-box {
      background: var(--stamp-green-soft); border: 1.5px solid var(--stamp-green); border-radius: 12px;
      padding: 14px; font-size: 0.84rem; white-space: pre-wrap; line-height: 1.55;
      font-family: 'Hind Siliguri', system-ui, sans-serif; margin: 10px 0; max-height: 280px; overflow-y: auto;
    }
</style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>
  <div id="license-gate" style="display:block;position:fixed;inset:0;z-index:9999;background:#EFE7D5;overflow-y:auto;">
    <div style="max-width:380px;margin:60px auto;padding:0 20px;font-family:'Hind Siliguri',sans-serif;color:#262016;text-align:center;">
      <div style="font-size:2.2rem;margin-bottom:8px">🔒</div>
      <h2 style="font-family:'Tiro Bangla',serif;margin-bottom:10px">চেক করা হচ্ছে...</h2>
    </div>
  </div>
  <header>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <h1 id="app-title">🏠 বাড়ি ভাড়া ম্যানেজার</h1>
        <p>সাব-মিটার · লাইন গ্যাস · অ্যাডভান্স · রসিদ</p>
      </div>
      <button onclick="driveDownload()" title="Drive থেকে সর্বশেষ ডাটা আনুন" style="background:rgba(255,255,255,0.12);border:1.5px solid rgba(251,243,222,0.35);color:#FBF3DE;width:38px;height:38px;border-radius:10px;font-size:1.05rem;cursor:pointer;flex-shrink:0">🔄</button>
    </div>
  </header>
  <div class="container" id="app"></div>
  <nav class="bottom">
    <button class="active" data-page="home" onclick="navigate('home')"><span class="icon">🏠</span>হোম</button>
    <button data-page="tenants" onclick="navigate('tenants')"><span class="icon">👥</span>ভাড়াটিয়া</button>
    <button data-page="bills" onclick="navigate('bills')"><span class="icon">🧾</span>বিল</button>
    <button data-page="payments" onclick="navigate('payments')"><span class="icon">💰</span>পেমেন্ট</button>
    <button data-page="settings" onclick="navigate('settings')"><span class="icon">⚙️</span>সেটিংস</button>
  </nav>
  <div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const DEFAULT_TENANTS = [
      { id:'t1', name:'তুতুল', floor:1, side:'Right', rent:4500, water:300, lineGas:0, hasSubMeter:false, unitRate:12, prevReading:0, mobile:'', nid:null, startMonth:'2024-01', leaveMonth:null, notes:'', advances:[], active:true },
      { id:'t2', name:'মজিবর', floor:1, side:'Right', rent:3500, water:200, lineGas:0, hasSubMeter:false, unitRate:12, prevReading:0, mobile:'', nid:null, startMonth:'2024-01', leaveMonth:null, notes:'', advances:[], active:true },
      { id:'t3', name:'হোসনা', floor:1, side:'Left', rent:4000, water:200, lineGas:0, hasSubMeter:false, unitRate:12, prevReading:0, mobile:'', nid:null, startMonth:'2024-01', leaveMonth:null, notes:'', advances:[], active:true },
      { id:'t4', name:'রমজান', floor:1, side:'Left', rent:3500, water:300, lineGas:0, hasSubMeter:false, unitRate:12, prevReading:0, mobile:'', nid:null, startMonth:'2024-01', leaveMonth:null, notes:'', advances:[], active:true },
      { id:'t5', name:'নিশাদ', floor:2, side:'', rent:6000, water:300, lineGas:0, hasSubMeter:true, unitRate:12, prevReading:0, mobile:'', nid:null, startMonth:'2024-01', leaveMonth:null, notes:'', advances:[], active:true },
      { id:'t6', name:'লুবনা', floor:3, side:'', rent:9000, water:600, lineGas:1080, hasSubMeter:false, unitRate:12, prevReading:0, mobile:'', nid:null, startMonth:'2024-01', leaveMonth:null, notes:'', advances:[], active:true },
      { id:'t7', name:'ফরিদ', floor:4, side:'', rent:6000, water:300, lineGas:0, hasSubMeter:false, unitRate:12, prevReading:0, mobile:'', nid:null, startMonth:'2024-01', leaveMonth:null, notes:'', advances:[], active:true },
      { id:'t8', name:'মারুফ', floor:5, side:'Right', rent:8500, water:500, lineGas:0, hasSubMeter:false, unitRate:12, prevReading:0, mobile:'', nid:null, startMonth:'2024-01', leaveMonth:null, notes:'', advances:[], active:true },
      { id:'t9', name:'কামাল', floor:5, side:'Left', rent:9000, water:600, lineGas:0, hasSubMeter:false, unitRate:12, prevReading:0, mobile:'', nid:null, startMonth:'2024-01', leaveMonth:null, notes:'', advances:[], active:true },
      { id:'t10', name:'রাকিব', floor:6, side:'Right', rent:4500, water:300, lineGas:0, hasSubMeter:true, unitRate:12, prevReading:0, mobile:'', nid:null, startMonth:'2024-01', leaveMonth:null, notes:'', advances:[], active:true },
      { id:'t11', name:'রুস্তম', floor:6, side:'Left', rent:4500, water:300, lineGas:0, hasSubMeter:true, unitRate:12, prevReading:0, mobile:'', nid:null, startMonth:'2024-01', leaveMonth:null, notes:'', advances:[], active:true }
    ];
    let state = { tenants: [], bills: {}, payments: [], currentMonth: getCurrentMonth(), landlord: { name: 'মোঃ জয়নাল আবেদিন', address: 'আনন্দ নগর, মেরুল বাড্ডা', phone: '01313046961' }, drive: { clientId: '', folderName: 'Rent app', fileId: null, lastSync: null } };
    function getCurrentMonth() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    }
    function monthLabel(ym) {
      if (!ym) return '-';
      const parts = ym.split('-');
      const months = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
      return months[parseInt(parts[1])-1] + ' ' + parts[0];
    }
    function prevMonthKey(ym) {
      const parts = ym.split('-').map(Number);
      const d = new Date(parts[0], parts[1]-2, 1);
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    }
    // Utility bills (water/gas/submeter) belong to PREVIOUS month when collecting rent for current month
    function utilMonthKey(ym) {
      return prevMonthKey(ym);
    }
    function utilMonthLabel(ym) {
      return monthLabel(utilMonthKey(ym));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem('rentAppData_v2');
        if (raw) {
          state = JSON.parse(raw);
          if (!state.currentMonth) state.currentMonth = getCurrentMonth();
          if (!state.landlord) {
            state.landlord = { name: 'মোঃ জয়নাল আবেদিন', address: 'আনন্দ নগর, মেরুল বাড্ডা', phone: '01313046961' };
          }
          if (!state.drive) {
            state.drive = { clientId: '', folderName: 'Rent app', fileId: null, lastSync: null };
          }
          state.tenants.forEach(function(t) {
            if (t.hasElectricity !== undefined && t.hasSubMeter === undefined) { t.hasSubMeter = t.hasElectricity; }
            if (t.gas !== undefined && t.lineGas === undefined) { t.lineGas = t.gas; }
            if (t.unitRate === undefined) t.unitRate = 12;
            if (t.active === undefined) t.active = true;
            if (!t.advances) t.advances = [];
            if (!t.extraCharges) t.extraCharges = [];
          });
        } else {
          const old = localStorage.getItem('rentAppData');
          if (old) {
            state = JSON.parse(old);
            state.tenants.forEach(function(t) {
              t.hasSubMeter = !!t.hasElectricity;
              t.lineGas = t.gas || 0;
              t.unitRate = 12;
              t.active = true;
              if (!t.advances) t.advances = [];
            if (!t.extraCharges) t.extraCharges = [];
            });
          } else {
            state.tenants = JSON.parse(JSON.stringify(DEFAULT_TENANTS));
            state.bills = {};
            state.payments = [];
          }
          state.currentMonth = getCurrentMonth();
          if (!state.landlord) {

    function floorText(t) {

    function activeTenants() { return state.tenants.filter(function(t){ return t.active !== false; }); }
    function getPrevReading(tenant, monthKey) {
      // Walk backward month by month to find the latest currentReading before this month
      var mk = prevMonthKey(monthKey);
      for (var i = 0; i < 24; i++) {
        var prevBill = state.bills[mk] && state.bills[mk][tenant.id];
        if (prevBill && prevBill.currentReading !== undefined && prevBill.currentReading !== null) {
          return parseInt(prevBill.currentReading) || 0;
        }
        mk = prevMonthKey(mk);
      }
      return tenant.prevReading || 0;
    }
    function calcBill(tenant, monthKey) {
      var b = (state.bills[monthKey] && state.bills[monthKey][tenant.id]) || {};
      var rent = tenant.rent;
      var water = tenant.water;
      var lineGas = tenant.lineGas || 0;
      var units = 0, electricity = 0, currentReading = null, prevReading = 0;
      if (tenant.hasSubMeter) {
        prevReading = getPrevReading(tenant, monthKey);
        currentReading = (b.currentReading !== undefined && b.currentReading !== null) ? b.currentReading : null;
        if (currentReading !== null) {
          units = Math.max(0, currentReading - prevReading);
        } else {
          units = b.units || 0;
        }
        electricity = units * (tenant.unitRate || 12);
      }
      // Extra bills (moyla etc.) — can override per month in b.extraAmounts
      var extras = [];
      var extraTotal = 0;
      var list = tenant.extraCharges || [];
      list.forEach(function(ex) {
        if (!ex || !ex.name) return;
        var amt = (b.extraAmounts && b.extraAmounts[ex.name] !== undefined)
          ? (parseInt(b.extraAmounts[ex.name]) || 0)
          : (parseInt(ex.amount) || 0);
        if (amt > 0 || (ex.amount && parseInt(ex.amount) > 0)) {
          extras.push({ name: ex.name, amount: amt });
          extraTotal += amt;
        }
      });
      var total = rent + water + lineGas + electricity + extraTotal;
      var paidAmount = b.paidAmount || 0;
      var paid = paidAmount > 0;
      var due = Math.max(0, total - paidAmount);
      return { rent:rent, water:water, lineGas:lineGas, electricity:electricity, units:units, extras:extras, extraTotal:extraTotal, total:total, paid:paid, paidAmount:paidAmount, due:due, paidDate:b.paidDate||'', note:b.note||'', currentReading:currentReading, prevReading:prevReading };
    }

        total += bill.due;

    function switchTab(btn, tab) {

      ['info','edit','advance','nid','leave'].forEach(function(id) {
        var el = document.getElementById('tab-'+id);
        if (el) el.classList.toggle('hidden', id !== tab);
      });
    }

    function handleNidUpload(id, input) {
      var file = input.files[0];
      if (!file) return;
      if (file.size > 900000) return toast('ছবি খুব বড় (৯০০KB এর নিচে)');
      var reader = new FileReader();
      reader.onload = function(e) {
        state.tenants.find(function(x){ return x.id === id; }).nid = e.target.result;
        saveState(); toast('NID সেভ হয়েছে');
        openTenantDetail(id);
        setTimeout(function(){ var tabs = document.querySelectorAll('.tab'); if (tabs[3]) switchTab(tabs[3], 'nid'); }, 50);
      };
      reader.readAsDataURL(file);
    }

    function renderBills() {

      ensureMonthBills(m);

      html += '<p style="font-size:0.8rem;color:var(--muted);margin-bottom:10px">সাব-মিটার থাকলে নতুন রিডিং দিন। একাধিক মাসের বাকি একসাথে পরিশোধ করা যাবে।</p>';

        else if (bill.paidAmount > 0) statusHtml = '<span class="chip" style="background:#fef3c7;color:#92400e">◐ আংশিক · বাকি ৳' + bill.due + '</span>';
        else statusHtml = '<span class="chip due">⏳ বাকি ৳' + bill.due + '</span>';

        var b = (state.bills[m] && state.bills[m][t.id]) || {};
        var smsHtml = '';
        if (bill.paidAmount > 0) {
          if (b.smsSent) {
            smsHtml = '<span class="chip paid">📱 SMS Done</span> <button class="btn btn-sm btn-accent" onclick="resendSms(\'' + t.id + '\',\'' + m + '\')">Resend</button>';
          } else {
            smsHtml = '<button class="btn btn-sm btn-accent" onclick="resendSms(\'' + t.id + '\',\'' + m + '\')">📱 SMS পাঠান / Resend</button>';
          }

        html += '<div class="card"><div class="tenant-header"><div><div class="tenant-name">' + t.name + '</div>';

        html += '<span class="floor-badge">৳' + bill.total + '</span></div>';
        html += '<div class="amount-row" style="margin:7px 0"><span class="chip">ভাড়া(' + monthLabel(m) + ') ৳' + bill.rent + '</span>';
        html += '<span class="chip">পানি(' + utilMonthLabel(m) + ') ৳' + bill.water + '</span>';
        if (bill.lineGas) html += '<span class="chip gas">গ্যাস(' + utilMonthLabel(m) + ') ৳' + bill.lineGas + '</span>';
        if (t.hasSubMeter) html += '<span class="chip sub">সাব(' + utilMonthLabel(m) + ') ৳' + bill.electricity + '</span>';
        if (bill.extras && bill.extras.length) {
          bill.extras.forEach(function(ex) {
            html += '<span class="chip">' + ex.name + '(' + utilMonthLabel(m) + ') ৳' + ex.amount + '</span>';
          });
        }
        html += '</div>' + statusHtml;
        if (prevDue > 0) {
          html += '<div style="font-size:0.8rem;color:var(--danger);margin-top:6px">⚠️ আগের মাসের বাকি: ৳' + prevDue.toLocaleString() + ' · <strong>মোট বাকি: ৳' + totalDueAll.toLocaleString() + '</strong></div>';
        } else if (totalDueAll > bill.due) {
          html += '<div style="font-size:0.8rem;color:var(--danger);margin-top:6px">মোট বাকি: ৳' + totalDueAll.toLocaleString() + '</div>';
        }
        if (t.hasSubMeter) {
          html += '<div class="reading-box"><div><label>Previous</label><input type="number" value="' + bill.prevReading + '" readonly /></div>';
          html += '<div><label>নতুন রিডিং</label><input type="number" id="reading-' + t.id + '" value="' + (bill.currentReading !== null ? bill.currentReading : '') + '" placeholder="লিখুন" onchange="updateReading(\'' + t.id + '\')" /></div>';

          html += '<div style="font-size:0.78rem;color:var(--muted);margin-bottom:6px">' + bill.units + ' unit × ৳' + (t.unitRate||12) + ' = ৳' + bill.electricity + '</div>';
        }

          var billSmsSent = b.billSmsSent;
          if (billSmsSent) {
            html += '<button class="btn btn-sm btn-success" onclick="sendBillSms(\'' + t.id + '\',\'' + m + '\')">📱 বিল SMS Done · Resend</button>';
          } else {
            html += '<button class="btn btn-sm btn-accent" onclick="sendBillSms(\'' + t.id + '\',\'' + m + '\')">📱 বিল SMS পাঠান</button>';

    function updateReading(id) {
      var t = state.tenants.find(function(x){ return x.id === id; });
      var val = document.getElementById('reading-'+id).value;
      ensureMonthBills(state.currentMonth);
      var b = state.bills[state.currentMonth][id];
      if (val === '' || val === null) {
        b.currentReading = null; b.units = 0;
      } else {
        b.currentReading = parseInt(val);
        var prev = getPrevReading(t, state.currentMonth);
        b.units = Math.max(0, b.currentReading - prev);
      }
      saveState(); render();
    }
    function getUnpaidMonths(tenantId) {
      var t = state.tenants.find(function(x){ return x.id === tenantId; });
      var months = [];
      var keys = Object.keys(state.bills).sort();
      if (keys.indexOf(state.currentMonth) < 0) keys.push(state.currentMonth);
      keys.sort();
      keys.forEach(function(mk) {
        ensureMonthBills(mk);
        var bill = calcBill(t, mk);
        if (bill.due > 0) {
          months.push({ month: mk, bill: bill });
        }
      });
      if (!months.length) {
        ensureMonthBills(state.currentMonth);
        months.push({ month: state.currentMonth, bill: calcBill(t, state.currentMonth) });
      }
      return months;
    }

    function savePayReading(tenantId, input) {
      var mk = input.getAttribute('data-month');

      var t = state.tenants.find(function(x){ return x.id === tenantId; });
      ensureMonthBills(mk);
      var b = state.bills[mk][tenantId];
      if (val === '' || val === null) {
        b.currentReading = null;
        b.units = 0;
      } else {
        b.currentReading = parseInt(val);
        var prev = getPrevReading(t, mk);
        b.units = Math.max(0, b.currentReading - prev);
      }
      saveState();

      var bill = calcBill(t, mk);

    function generateReceiptCanvas(tenant, paymentsInfo, totalPaid, totalDueAfter, payMethod, cb) {
      var W = 640, H = 900;
      var canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext('2d');

      function draw() {
        ctx.fillStyle = '#FFFCF6';
        ctx.fillRect(0, 0, W, H);
        // ledger-paper texture lines
        ctx.strokeStyle = 'rgba(150,101,43,0.06)';
        ctx.lineWidth = 1;
        for (var ly = 140; ly < H; ly += 30) { ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke(); }

        var grad = ctx.createLinearGradient(0, 0, W, 120);
        grad.addColorStop(0, '#2A2015'); grad.addColorStop(1, '#6E4A22');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, W, 120);
        ctx.fillStyle = '#FBF3DE'; ctx.textAlign = 'center';
        ctx.font = '700 28px "Tiro Bangla", sans-serif';
        ctx.fillText('🏠 ' + (state.appName || 'বাড়ি ভাড়া ম্যানেজার'), W / 2, 55);
        ctx.font = '400 16px "Hind Siliguri", sans-serif';
        ctx.fillText('পেমেন্ট রসিদ', W / 2, 88);

        var L = state.landlord || { name: 'মোঃ জয়নাল আবেদিন', address: 'আনন্দ নগর, মেরুল বাড্ডা' };
        var y = 160;
        ctx.textAlign = 'left'; ctx.fillStyle = '#262016';
        ctx.font = '700 22px "Hind Siliguri", sans-serif';
        ctx.fillText(tenant.name + ' | ' + floorText(tenant), 40, y);
        y += 30;
        ctx.font = '400 15px "Hind Siliguri", sans-serif'; ctx.fillStyle = '#6b5f4d';
        ctx.fillText(L.name + ', ' + L.address, 40, y);
        y += 34;

        ctx.strokeStyle = '#D9CBA8'; ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(W - 40, y); ctx.stroke(); ctx.setLineDash([]);
        y += 30;

        ctx.font = '700 16px "Hind Siliguri", sans-serif'; ctx.fillStyle = '#6E4A1E';
        ctx.fillText('বিবরণ', 40, y);
        y += 28;
        ctx.font = '400 16px "Hind Siliguri", sans-serif'; ctx.fillStyle = '#262016';
        paymentsInfo.forEach(function(pi) {
          var bill = calcBill(tenant, pi.month);
          var rentLabel = monthLabel(pi.month);
          var utilLabel = utilMonthLabel(pi.month);
          var rows = [['ভাড়া (' + rentLabel + ')', bill.rent]];
          if (bill.water) rows.push(['পানি (' + utilLabel + ')', bill.water]);
          if (bill.lineGas) rows.push(['লাইন গ্যাস (' + utilLabel + ')', bill.lineGas]);
          if (bill.extras && bill.extras.length) bill.extras.forEach(function(ex) { rows.push([ex.name + ' (' + utilLabel + ')', ex.amount]); });
          rows.forEach(function(r) {
            ctx.textAlign = 'left'; ctx.fillText(r[0], 40, y);
            ctx.textAlign = 'right'; ctx.fillText('৳' + r[1], W - 40, y);
            y += 26;
          });
        });

        y += 8;
        ctx.strokeStyle = '#96652B'; ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(W - 40, y); ctx.stroke();
        y += 36;

        ctx.textAlign = 'left'; ctx.font = '700 22px "Hind Siliguri", sans-serif'; ctx.fillStyle = '#262016';
        ctx.fillText('সর্বমোট পরিশোধ', 40, y);
        ctx.textAlign = 'right'; ctx.fillStyle = '#6E4A1E';
        ctx.fillText('৳' + totalPaid, W - 40, y);
        y += 32;

        ctx.textAlign = 'left';
        if (totalDueAfter) {
          ctx.font = '600 16px "Hind Siliguri", sans-serif'; ctx.fillStyle = '#9A3A2D';
          ctx.fillText('বাকি রইলো: ৳' + totalDueAfter, 40, y);
          y += 28;
        } else {
          ctx.font = '600 16px "Hind Siliguri", sans-serif'; ctx.fillStyle = '#3E6B49';
          ctx.fillText('কোনো বকেয়া নেই', 40, y);
          y += 28;
        }
        ctx.font = '400 15px "Hind Siliguri", sans-serif'; ctx.fillStyle = '#6b5f4d';
        if (payMethod) { ctx.fillText('মাধ্যম: ' + payMethod, 40, y); y += 24; }
        var dateStr = new Date().toLocaleDateString('bn-BD');
        ctx.fillText('তারিখ: ' + dateStr, 40, y);

        // PAID stamp/seal
        ctx.save();
        ctx.translate(W - 145, H - 200);
        ctx.rotate(-18 * Math.PI / 180);
        ctx.strokeStyle = '#3E6B49'; ctx.lineWidth = 4; ctx.setLineDash([9, 6]);
        ctx.beginPath(); ctx.arc(0, 0, 82, 0, 2 * Math.PI); ctx.stroke();
        ctx.setLineDash([]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 68, 0, 2 * Math.PI); ctx.stroke();
        ctx.fillStyle = '#3E6B49'; ctx.textAlign = 'center';
        ctx.font = '700 32px "Hind Siliguri", sans-serif';
        ctx.fillText('PAID', 0, 12);
        ctx.font = '600 13px "Hind Siliguri", sans-serif';
        ctx.fillText('✓ পরিশোধিত', 0, 34);
        ctx.restore();

        ctx.textAlign = 'center'; ctx.font = '400 13px "Hind Siliguri", sans-serif'; ctx.fillStyle = '#9C8F73';
        ctx.fillText('এই রসিদটি ইলেকট্রনিকভাবে তৈরি করা হয়েছে', W / 2, H - 28);

        canvas.toBlob(function(blob) { cb(blob); }, 'image/png');
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(draw).catch(draw);
      } else draw();
    }

    function shareReceiptImage() {
      var d = window._lastReceiptData;

    function toWhatsappNumber(phone) {
      var digits = (phone || '').replace(/[^0-9]/g, '');
      if (digits.length === 11 && digits.charAt(0) === '0') digits = '880' + digits.substring(1);
      else if (digits.length === 10) digits = '880' + digits;
      return digits;
    }

      var num = toWhatsappNumber(phone);

      window.open(url, '_blank');

    function copySms() {
      var msg = window._lastSms || '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(msg).then(function(){ toast('মেসেজ কপি হয়েছে ✓'); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = msg;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        toast('মেসেজ কপি হয়েছে ✓');

    function confirmPaid(id) {
      var amount = parseInt(document.getElementById('pay-amount').value) || 0;
      if (amount <= 0) return toast('পরিমাণ দিন');
      var date = document.getElementById('pay-date').value;
      var note = document.getElementById('pay-note').value;
      var payMethod = getSelectedPayMethod();
      var cbs = document.querySelectorAll('.pay-month-cb:checked');
      if (!cbs.length) return toast('কমপক্ষে এক মাস সিলেক্ট করুন');

      var t = state.tenants.find(function(x){ return x.id === id; });
      var selectedMonths = [];
      cbs.forEach(function(cb){ selectedMonths.push(cb.getAttribute('data-month')); });
      selectedMonths.sort();

      var remaining = amount;
      var paymentsInfo = [];
      var paidMonths = [];

      selectedMonths.forEach(function(mk) {
        ensureMonthBills(mk);
        var b = state.bills[mk][id];
        var billBefore = calcBill(t, mk);
        var due = billBefore.due;
        var payThis = Math.min(remaining, due);
        if (payThis > 0 || due === 0) {
          b.paidAmount = (b.paidAmount || 0) + payThis;
          b.paidDate = date;
          b.note = note;
          b.payMethod = payMethod;
          remaining -= payThis;
          // keep meter/units from before payment for SMS
          var billAfter = calcBill(t, mk);
          billAfter.currentReading = billBefore.currentReading;
          billAfter.prevReading = billBefore.prevReading;
          billAfter.units = billBefore.units;
          billAfter.electricity = billBefore.electricity;
          billAfter.rent = billBefore.rent;
          billAfter.water = billBefore.water;
          billAfter.lineGas = billBefore.lineGas;
          billAfter.total = billBefore.total;
          paymentsInfo.push({ month: mk, bill: billAfter, paidThis: payThis });
          paidMonths.push(mk);
        }
      });

      if (remaining > 0 && paidMonths.length) {
        var lastMk = paidMonths[paidMonths.length - 1];
        state.bills[lastMk][id].paidAmount += remaining;
        paymentsInfo[paymentsInfo.length - 1].paidThis += remaining;
        paymentsInfo[paymentsInfo.length - 1].bill = calcBill(t, lastMk);
        remaining = 0;
      }

      var totalDueAfter = getTotalDue(t);
      var smsMsg = buildSmsMessage(t, paymentsInfo, amount, totalDueAfter, payMethod);
      var smsMsgWA = buildSmsMessageWhatsapp(t, paymentsInfo, amount, totalDueAfter, payMethod);

      var monthAmounts = {};
      paymentsInfo.forEach(function(pi){ monthAmounts[pi.month] = pi.paidThis; });
      state.payments.unshift({
        id: 'p' + Date.now(),
        tenantId: id,
        tenantName: t.name,
        month: paidMonths.join(','),
        months: paidMonths.slice(),
        monthAmounts: monthAmounts,
        amount: amount,
        date: date,
        note: note,
        payMethod: payMethod,
        totalBill: paymentsInfo.reduce(function(s, p){ return s + p.bill.total; }, 0),
        remainingDue: totalDueAfter,
        smsText: smsMsg,
        smsTextWA: smsMsgWA
      });

      paidMonths.forEach(function(mk) {
        state.bills[mk][id].smsText = smsMsg;
        state.bills[mk][id].smsTextWA = smsMsgWA;
        state.bills[mk][id].smsSent = false;
      });

      window._lastSms = smsMsg;
      window._lastSmsWA = smsMsgWA;
      window._lastPaidMonths = paidMonths.slice();
      window._lastReceiptData = { tenantId: id, paymentsInfo: paymentsInfo, totalPaid: amount, totalDueAfter: totalDueAfter, payMethod: payMethod };
      saveState();
      toast('পেমেন্ট রেকর্ড হয়েছে ✓');
      showSmsAfterPayment(id, smsMsg);
    }

    function savePaymentEdit(idx) {
      var p = state.payments[idx];
      var newAmt = parseInt(document.getElementById('ep-amount').value) || 0;
      var oldAmt = p.amount;
      var diff = newAmt - oldAmt;
      p.amount = newAmt;
      p.date = document.getElementById('ep-date').value;
      p.note = document.getElementById('ep-note').value;
      // adjust bill paidAmount on related months
      var months = p.months || (p.month ? p.month.split(',') : []);
      if (months.length && diff !== 0) {
        var mk = months[months.length - 1];

            saveLicenseInfo(lic);
            if (manual) toast('বাঁধা হয়ে গেছে ✓ (' + currentEmail + ')');
          } else if (boundEmail.toLowerCase() !== currentEmail.toLowerCase()) {
            showAccountMismatchWarning(boundEmail, currentEmail);
          } else {
            lic.driveEmail = currentEmail;
            saveLicenseInfo(lic);
            if (manual) toast('আগে থেকেই ঠিকমতো বাঁধা আছে ✓');
          }
        });
      }).catch(function() { if (manual) toast('নেটওয়ার্ক এরর'); });
    }
    function fetchBoundEmailFromSheet(key, cb) {
      if (!LICENSE_SHEET_CSV_URL || LICENSE_SHEET_CSV_URL.indexOf('PASTE_YOUR') === 0) { cb(null); return; }
      fetch(LICENSE_SHEET_CSV_URL).then(function(r) {
        if (!r.ok) throw new Error('bad response');
        return r.text();
      }).then(function(text) {
        var rows = parseLicenseCSV(text);
        var match = rows.find(function(r) { return (r.LicenseKey || '').toLowerCase() === key.trim().toLowerCase(); });
        cb(match ? (match.BoundEmail || '').trim() : '');
      }).catch(function() { cb(null); });
    }
    function registerBinding(key, email) {
      if (!LICENSE_BIND_SCRIPT_URL || LICENSE_BIND_SCRIPT_URL.indexOf('PASTE_YOUR') === 0) return;
      fetch(LICENSE_BIND_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ type: 'bind', key: key, email: email })
      }).catch(function() {});
    }
    function backupToAdmin() {
      // পেইড কাস্টমারের ডাটার একটা কপি বিক্রেতার শীটেও ব্যাকআপ হয় (Admin Dashboard-এ দেখার জন্য)
      if (!LICENSE_BIND_SCRIPT_URL || LICENSE_BIND_SCRIPT_URL.indexOf('PASTE_YOUR') === 0) return;
      var lic = getLicenseInfo();
      if (!lic || !lic.key) return;
      fetch(LICENSE_BIND_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ type: 'backup', key: lic.key, json: JSON.stringify(state) })
      }).catch(function() {});
    }
    function showAccountMismatchWarning(boundEmail, currentEmail) {
      var masked = boundEmail.replace(/(.{2}).+(@.+)/, '$1***$2');
      var msg = '⚠️ এই লাইসেন্স কোড আগে ' + masked + ' একাউন্টের সাথে যুক্ত হয়েছিল। এখন ভিন্ন একাউন্ট (' + currentEmail + ') দিয়ে ব্যবহার হচ্ছে।\n\nএকই কোড একাধিক একাউন্টে ব্যবহার করলে এটা লাইসেন্স শর্ত ভঙ্গ হিসেবে গণ্য হবে। ভিন্ন ডিভাইস/একাউন্টে সরাতে চাইলে বিক্রেতার সাথে যোগাযোগ করুন।';
      alert(msg);
    }


    function driveSignOut() {
      _driveAccessToken = null;
      toast('ড্রাইভ ডিসকানেক্ট');
      render();
    }

    function driveFetch(url, options) {
      options = options || {};
      options.headers = options.headers || {};
      options.headers['Authorization'] = 'Bearer ' + _driveAccessToken;
      return fetch(url, options).then(function(r) {
        if (!r.ok) return r.text().then(function(t){ throw new Error(t || r.status); });
        var ct = r.headers.get('content-type') || '';
        if (ct.indexOf('application/json') >= 0) return r.json();
        return r.text();
      });
    }

    function findOrCreateFolder() {
      var cfg = getDriveConfig();
      var name = (cfg.folderName || 'Rent app').replace(/'/g, "\\'");
      var q = "name='" + name + "' and mimeType='application/vnd.google-apps.folder' and trashed=false";
      return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id,name)')
        .then(function(data) {
          if (data.files && data.files.length) return data.files[0].id;
          // create folder
          return driveFetch('https://www.googleapis.com/drive/v3/files', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: cfg.folderName || 'Rent app',
              mimeType: 'application/vnd.google-apps.folder'
            })
          }).then(function(f){ return f.id; });
        });
    }

    function findDataFile(folderId) {
      var q = "name='" + DRIVE_FILE_NAME + "' and '" + folderId + "' in parents and trashed=false";
      return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id,name,modifiedTime)')
        .then(function(data) {
          if (data.files && data.files.length) return data.files[0];
          return null;
        });
    }

    function driveUpload(silent) {
      if (!_driveAccessToken) { if (!silent) toast('আগে Google সাইন-ইন করুন'); return; }
      if (!silent) toast('আপলোড হচ্ছে...');
      var payload = JSON.stringify(state);
      findOrCreateFolder().then(function(folderId) {
        return findDataFile(folderId).then(function(existing) {
          var metadata, url, method;
          if (existing) {
            // update
            url = 'https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=media';
            return driveFetch(url, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: payload
            }).then(function() {
              getDriveConfig().fileId = existing.id;
              getDriveConfig().lastSync = new Date().toISOString();
              persistLocal();
              if (!silent) { toast('Drive এ সেভ হয়েছে ✓'); render(); }
              else updateSyncIndicator();
            });
          } else {
            // create multipart
            var meta = { name: DRIVE_FILE_NAME, parents: [folderId] };
            var boundary = 'foo_bar_baz';
            var body = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
              JSON.stringify(meta) + '\r\n--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' +
              payload + '\r\n--' + boundary + '--';
            return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
              method: 'POST',
              headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
              body: body
            }).then(function(f) {
              getDriveConfig().fileId = f.id;
              getDriveConfig().lastSync = new Date().toISOString();
              persistLocal();
              if (!silent) { toast('Drive এ সেভ হয়েছে ✓'); render(); }
              else updateSyncIndicator();
            });
          }
        });
      }).catch(function(e) {
        console.error(e);
        if (!silent) toast('আপলোড ব্যর্থ — Client ID / পারমিশন চেক করুন');
      });
    }
    function updateSyncIndicator() {
      var el = document.getElementById('drive-last-sync-text');
      if (el && getDriveConfig().lastSync) el.textContent = new Date(getDriveConfig().lastSync).toLocaleString();
    }

    function driveDownload() {
      if (!_driveAccessToken) { driveSignIn(); return; }
      toast('ডাউনলোড হচ্ছে...');
      findOrCreateFolder().then(function(folderId) {
        return findDataFile(folderId).then(function(existing) {
          if (!existing) {
            toast('Drive এ এখনো কোনো ব্যাকআপ নেই — আগে আপলোড করুন');
            return;
          }
          return driveFetch('https://www.googleapis.com/drive/v3/files/' + existing.id + '?alt=media')
            .then(function(data) {
              var parsed = typeof data === 'string' ? JSON.parse(data) : data;
              if (!parsed.tenants) throw new Error('invalid data');
              if (!confirm('Drive এর ডাটা দিয়ে লোকাল ডাটা বদলে যাবে। চালিয়ে যাবেন?')) return;
              state = parsed;
              if (!state.currentMonth) state.currentMonth = getCurrentMonth();
              if (!state.drive) state.drive = getDriveConfig();
              getDriveConfig().fileId = existing.id;
              getDriveConfig().lastSync = new Date().toISOString();
              // keep clientId if was set locally
              persistLocal();
              toast('Drive থেকে লোড হয়েছে ✓');
              navigate('home');
            });
        });
      }).catch(function(e) {
        console.error(e);
        toast('ডাউনলোড ব্যর্থ');
      });
    }

    function saveDriveSettings() {
      var cfg = getDriveConfig();
      cfg.clientId = (document.getElementById('drive-client-id') || {}).value || '';
      cfg.folderName = (document.getElementById('drive-folder') || {}).value || 'Rent app';
      saveState();
      toast('Drive সেটিংস সেভ ✓');
    }

    
    function exportData() {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'bari-bhara-backup-' + getCurrentMonth() + '.json';
      a.click();
      URL.revokeObjectURL(url);
      toast('ব্যাকআপ ডাউনলোড হয়েছে');
    }
    function importData(input) {
      var file = input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var data = JSON.parse(e.target.result);
          if (data.tenants && Array.isArray(data.tenants)) {
            state = data;
            if (!state.currentMonth) state.currentMonth = getCurrentMonth();
            saveState(); toast('রিস্টোর সফল ✓'); navigate('home');
          } else toast('ভুল ফাইল');
        } catch(err) { toast('ফাইল পড়া যায়নি'); }
      };
      reader.readAsText(file);
    }
    function importFromPaste() {
      var box = document.getElementById('paste-json-box');
      var text = box ? box.value.trim() : '';
      if (!text) { toast('আগে JSON টেক্সট পেস্ট করুন'); return; }
      try {
        var data = JSON.parse(text);
        if (data.tenants && Array.isArray(data.tenants)) {
          state = data;
          if (!state.currentMonth) state.currentMonth = getCurrentMonth();
          saveState(); toast('রিস্টোর সফল ✓'); navigate('home');
        } else toast('এটা সঠিক ডাটা মনে হচ্ছে না');
      } catch (err) { toast('টেক্সট পড়া যায়নি — সম্পূর্ণ কপি হয়েছে কিনা দেখুন'); }
    }
    function resetData() {
      if (!confirm('সব ডাটা মুছে যাবে। নিশ্চিত?')) return;
      localStorage.removeItem('rentAppData_v2');
      localStorage.removeItem('rentAppData');
      loadState(); toast('রিসেট হয়েছে'); navigate('home');
    }
    // ===== সাবস্ক্রিপশন / লাইসেন্স চেক =====
    // Google Sheet কে ডাটাবেজ হিসেবে ব্যবহার করা হয়। শীটে কলাম রাখুন ঠিক এই নামে:
    // LicenseKey , CustomerName , ExpiryDate (YYYY-MM-DD)
    // তারপর File > Share > Publish to web > CSV — সেই লিংক নিচে বসান।
    var LICENSE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmfcLHrp0GwaiBYuaJwDUpnrQtE3kQmjFkUFJaK_YBxpVuo_LrimgGjESv2vo4JLv8XRpPgQZpjSZ4/pub?gid=0&single=true&output=csv';

    function getLicenseInfo() {
      try { return JSON.parse(localStorage.getItem('rentAppLicense') || 'null'); }
      catch (e) { return null; }
    }
    function saveLicenseInfo(info) {
      localStorage.setItem('rentAppLicense', JSON.stringify(info));
    }
    function todayISO() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function isLicenseValidLocally(info) {
      if (!info || !info.expiry) return false;
      var exp = new Date(info.expiry + 'T23:59:59');
      return exp.getTime() >= Date.now();
    }
    function parseLicenseCSV(text) {
      var lines = text.trim().split(/\r?\n/);
      if (!lines.length) return [];
      var headers = lines[0].split(',').map(function(h) { return h.trim(); });
      return lines.slice(1).filter(function(l) { return l.trim().length; }).map(function(line) {
        var cells = line.split(',');
        var row = {};
        headers.forEach(function(h, i) { row[h] = (cells[i] || '').trim(); });
        return row;
      });
    }
    function validateLicenseKey(key, cb) {
      if (!LICENSE_SHEET_CSV_URL || LICENSE_SHEET_CSV_URL.indexOf('PASTE_YOUR') === 0) {
        cb('not_configured'); return;
      }
      fetch(LICENSE_SHEET_CSV_URL).then(function(r) {
        if (!r.ok) throw new Error('bad response');
        return r.text();
      }).then(function(text) {
        var rows = parseLicenseCSV(text);
        var match = rows.find(function(r) {
          return (r.LicenseKey || '').toLowerCase() === key.trim().toLowerCase();
        });
        if (!match) { cb('not_found'); return; }
        var prev = getLicenseInfo();
        var info = { key: match.LicenseKey, name: match.CustomerName || '', expiry: match.ExpiryDate || '', lastChecked: todayISO() };
        if (prev && prev.key && prev.key.toLowerCase() === info.key.toLowerCase() && prev.driveEmail) {
          info.driveEmail = prev.driveEmail; // পুরনো একাউন্ট-বাইন্ডিং হারিয়ে যাবে না
        }
        if (isLicenseValidLocally(info)) cb('ok', info);
        else cb('expired', info);
      }).catch(function() { cb('network'); });
    }

    function licenseGateHTML(mode, info, message) {
      var wa = 'https://wa.me/8801XXXXXXXXX';
      var box = '<div style="max-width:380px;margin:60px auto;padding:0 20px;font-family:\'Hind Siliguri\',sans-serif;color:#262016;text-align:center;">';
      box += '<div style="font-size:2.2rem;margin-bottom:8px">🔒</div>';
      if (mode === 'checking') {
        box += '<h2 style="font-family:\'Tiro Bangla\',serif;margin-bottom:10px">চেক করা হচ্ছে...</h2>';
      } else if (mode === 'expired') {
        box += '<h2 style="font-family:\'Tiro Bangla\',serif;margin-bottom:10px">মেয়াদ শেষ হয়ে গেছে</h2>';
        box += '<p style="font-size:0.9rem;color:#6b5f4d;margin-bottom:18px">' + (info && info.expiry ? 'আপনার সাবস্ক্রিপশনের মেয়াদ ছিল ' + info.expiry + ' পর্যন্ত।' : '') + ' রিনিউ করতে WhatsApp করুন, তারপর নিচে চাপুন।</p>';
        box += '<a href="' + wa + '" target="_blank" style="display:block;background:linear-gradient(135deg,#6E4A1E,#96652B);color:#FBF3DE;padding:14px;border-radius:10px;text-decoration:none;font-weight:700;margin-bottom:10px">WhatsApp করে রিনিউ করুন</a>';
        box += '<button onclick="recheckLicense(\'' + (info ? info.key : '') + '\')" style="width:100%;padding:14px;border-radius:10px;border:1.5px solid #D9CBA8;background:#FFFCF6;font-weight:700;color:#6b5f4d;cursor:pointer">রিনিউ করেছি, আবার চেক করুন</button>';
      } else {
        box += '<h2 style="font-family:\'Tiro Bangla\',serif;margin-bottom:6px">অ্যাক্টিভেশন কোড দিন</h2>';
        box += '<p style="font-size:0.9rem;color:#6b5f4d;margin-bottom:18px">কেনার সময় যে কোডটি পেয়েছেন সেটি বসান।</p>';
        if (message) box += '<p style="font-size:0.85rem;color:#9A3A2D;margin-bottom:12px">' + message + '</p>';
        box += '<input id="license-key-input" placeholder="যেমন: IBR-1234" style="width:100%;padding:13px;border-radius:10px;border:1.5px solid #D9CBA8;margin-bottom:12px;font-size:1rem;text-align:center" />';
        box += '<button onclick="activateLicense()" style="width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#6E4A1E,#96652B);color:#FBF3DE;font-weight:700;cursor:pointer;margin-bottom:14px">সক্রিয় করুন</button>';
        box += '<p style="font-size:0.85rem;color:#6b5f4d">এখনো কেনেননি? <a href="' + wa + '" target="_blank" style="color:#6E4A1E;font-weight:700">WhatsApp করুন</a></p>';
      }
      box += '</div>';
      return box;
    }
    function showLicenseGate(mode, info, message) {
      var gate = document.getElementById('license-gate');
      gate.innerHTML = licenseGateHTML(mode, info, message);
      gate.style.display = 'block';
    }
    function hideLicenseGate() {
      document.getElementById('license-gate').style.display = 'none';
    }
    function activateLicense() {
      var input = document.getElementById('license-key-input');
      var key = input ? input.value.trim() : '';
      if (!key) return;
      showLicenseGate('checking');
      validateLicenseKey(key, function(status, info) {
        if (status === 'ok') { saveLicenseInfo(info); hideLicenseGate(); }
        else if (status === 'expired') { saveLicenseInfo(info); showLicenseGate('expired', info); }
        else if (status === 'not_found') showLicenseGate('activate', null, 'এই কোডটি সঠিক নয়, আবার চেষ্টা করুন।');
        else if (status === 'not_configured') showLicenseGate('activate', null, 'লাইসেন্স সিস্টেম এখনো সেটআপ হয়নি (LICENSE_SHEET_CSV_URL বসাতে হবে)।');
        else showLicenseGate('activate', null, 'ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন।');
      });
    }
    function recheckLicense(key) {
      if (!key) { showLicenseGate('activate'); return; }
      showLicenseGate('checking');
      validateLicenseKey(key, function(status, info) {
        if (status === 'ok') { saveLicenseInfo(info); hideLicenseGate(); }
        else if (status === 'expired') { saveLicenseInfo(info); showLicenseGate('expired', info); }
        else showLicenseGate('expired', { key: key }, 'ইন্টারনেট সংযোগ চেক করুন।');
      });
    }
    function bootLicenseCheck() {
      var info = getLicenseInfo();
      if (isLicenseValidLocally(info)) {
        hideLicenseGate();
        backupToAdmin();
        // ব্যাকগ্রাউন্ডে চুপচাপ আবার যাচাই করে রাখা হয়, যাতে রিনিউ/বাতিল আপডেট থাকে
        validateLicenseKey(info.key, function(status, freshInfo) {
          if (status === 'ok' || status === 'expired') saveLicenseInfo(freshInfo);
          if (status === 'expired') showLicenseGate('expired', freshInfo);
        });
      } else {
        showLicenseGate(info ? 'expired' : 'activate', info);
      }
    }

    loadState();
    applyTheme(getSavedTheme());
    render();
    updateAppTitle();
    trySilentDriveSignIn();
    bootLicenseCheck();
    var style = document.createElement('style');
    style.textContent = '@media print { body * { visibility: hidden !important; } #receipt-box, #receipt-box * { visibility: visible !important; } #receipt-box { position: absolute; left: 0; top: 0; width: 100%; } .modal-overlay, nav, header, .btn-row, .modal-header { display: none !important; } .receipt { break-inside: avoid; } }';
    document.head.appendChild(style);
  </script>
